<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme-init.js"></script>
<script src="consent.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign in — Impact Grid</title>
<meta name="description" content="Sign in to your Impact Grid photographer dashboard."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#0d0d0d;--sand:#f3ede3;--line:#d9d0bf;--slate:#4a4a4a;--mute:#8a8578;--err:#b42318;--ok:#18794e;}
[data-theme="dark"]{--bg:#0c0d10;--card:#14161b;--ink:#f5f1e8;--sand:#1c1f26;--line:#2d313a;--slate:#b4b0a6;--mute:#7d7a72;--err:#ff8a7a;--ok:#5fd39b;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:inherit;}
.shell{min-height:100%;display:flex;flex-direction:column;}
.top{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
.top a{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;}
.top a:hover{opacity:.7;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 24px 64px;}
.col{width:100%;max-width:342px;text-align:center;}
.logo{width:36px;height:36px;margin:0 auto 18px;border-radius:9px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.05em;}
h1{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:600;}
.sub{margin-top:12px;font-size:14px;color:var(--slate);line-height:1.5;}
.btns{margin-top:32px;display:grid;gap:11px;}
.btn{display:flex;align-items:center;width:100%;height:55px;padding:0 20px;border:1px solid var(--ink);background:var(--card);color:var(--ink);font:500 14px "DM Sans",sans-serif;cursor:pointer;transition:background .15s;}
.btn:hover{background:var(--sand);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn span{flex:1;padding-right:18px;}
.btn svg{flex-shrink:0;}
.submit{display:flex;align-items:center;justify-content:center;width:100%;height:55px;border:0;background:var(--ink);color:var(--bg);font:500 14px "DM Sans",sans-serif;cursor:pointer;}
.submit:disabled{opacity:.6;cursor:not-allowed;}
form{margin-top:32px;text-align:left;display:none;}
form.open{display:block;}
label{display:block;font-size:14px;margin-bottom:16px;}
.input{display:block;width:100%;margin-top:4px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:400 14.4px "DM Sans",sans-serif;outline:none;transition:border-color .15s,box-shadow .15s;}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(128,128,128,.18);}
.input::placeholder{color:var(--mute);}
.pw{position:relative;}
.pw .input{padding-right:58px;}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);margin-top:2px;background:none;border:0;color:var(--slate);font:600 12px "DM Sans",sans-serif;cursor:pointer;padding:6px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.link{margin-top:16px;text-align:center;font-size:14px;}
.link a{font-weight:500;text-decoration:underline;}
.err{margin-top:16px;font-size:14px;color:var(--err);text-align:center;}
.err a{color:inherit;text-decoration:underline;}
.foot{margin-top:32px;font-size:14px;color:var(--slate);}
.foot a{color:var(--ink);font-weight:500;text-decoration:underline;}
.fine{margin-top:14px;font-size:12px;color:var(--mute);line-height:1.5;text-align:center;}
.strength{display:flex;gap:4px;margin:-8px 0 6px;}
.strength i{flex:1;height:3px;background:var(--line);border-radius:2px;}
.strength i.on1{background:#d92d20;}.strength i.on2{background:#f79009;}.strength i.on3{background:#84cc16;}.strength i.on4{background:var(--ok);}
.slabel{font-size:12px;color:var(--mute);min-height:16px;margin-bottom:12px;}
.done{display:none;}
.done.show{display:block;}
.done .pill{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);padding:5px 10px;border-radius:99px;margin-bottom:16px;}
.done .submit{text-decoration:none;margin-top:28px;}
@media(max-width:480px){.row2{grid-template-columns:1fr;gap:0;}}

</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a href="index.html">&larr; Back</a>
    <a href="join.html">Create account</a>
  </header>

  <main>
    <div class="col">
      <div class="logo">IG</div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your Impact Grid dashboard.</p>

      <div class="btns">
        <button type="button" class="btn" id="googleBtn" onclick="googleSignIn()">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          <span>Sign in with Google</span>
        </button>
        <button type="button" class="btn" id="emailBtn" onclick="openEmail()" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          <span>Sign in with Email</span>
        </button>
      </div>

      <form id="emailForm" onsubmit="return login(event)">
        <label>Email
          <input id="email" class="input" type="email" autocomplete="email" required/>
        </label>
        <label>Password
          <div class="pw">
            <input id="password" class="input" type="password" autocomplete="current-password" required/>
            <button type="button" class="eye" id="eyeBtn" onclick="togglePw()" aria-label="Show password">Show</button>
          </div>
        </label>
        <button class="submit" id="loginBtn" type="submit">Sign in</button>
        <p class="link"><a href="reset-password.html">Forgot password?</a></p>
      </form>

      <p class="err" id="alertBox" role="alert" style="display:none"></p>

      <p class="foot">New to Impact Grid? <a href="join.html">Create account</a></p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
var EVENTS_API = 'https://impactgrid-events-api.onrender.com';

function showAlert(msg) {
  var el = document.getElementById('alertBox');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}
function openEmail() {
  document.getElementById('emailForm').classList.add('open');
  document.getElementById('emailBtn').setAttribute('aria-expanded', 'true');
  setTimeout(function(){ document.getElementById('email').focus(); }, 0);
}
function togglePw() {
  var inp = document.getElementById('password'), btn = document.getElementById('eyeBtn');
  var hidden = inp.type === 'password';
  inp.type = hidden ? 'text' : 'password';
  btn.textContent = hidden ? 'Hide' : 'Show';
}

/* Admin goes to admin.html (email only; the server re-checks it). Everyone else to the dashboard. */
function isAdminUser(user) {
  var adminEmail = (localStorage.getItem('ig_biz_admin_email') || 'admin@impactgridgroup.com').toLowerCase();
  return !!(user && user.email && user.email.toLowerCase() === adminEmail);
}

/* Ask the server to give a brand-new photographer account its role. Best effort, never blocks for long. */
function onboard(session) {
  if (!session || isAdminUser(session.user)) return Promise.resolve();
  var call = fetch(EVENTS_API + '/api/photographer-onboard', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + session.access_token }
  }).catch(function(){});
  var wait = new Promise(function(res){ setTimeout(res, 8000); });
  return Promise.race([call, wait]);
}

async function finishLogin(session) {
  await onboard(session);
  window.location.href = isAdminUser(session.user) ? 'admin.html' : 'dashboard.html';
}

/* Existing session or Google callback */
(function() {
  var client = getSupabase();
  if (!client) return;
  client.auth.getSession().then(function(res) {
    if (!res.data || !res.data.session) return;
    var isOAuthCallback = window.location.hash && window.location.hash.length > 1;
    if (!isOAuthCallback && window.location.search.indexOf('logout') !== -1) return;
    finishLogin(res.data.session);
  }).catch(function(){});
})();

async function googleSignIn() {
  var c = getSupabase();
  if (!c) { showAlert('Sign-in is not ready. Please refresh the page.'); return; }
  showAlert('');
  try {
    var res = await c.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/login.html',
        queryParams: { prompt: 'select_account' }
      }
    });
    if (res.error) throw res.error;
  } catch (err) {
    showAlert("Google sign-in isn't available right now. Please use email instead.");
  }
}

async function login(ev) {
  if (ev) ev.preventDefault();
  var btn = document.getElementById('loginBtn');
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  showAlert('');
  if (!email || !password) { showAlert('Please enter your email and password.'); return false; }

  btn.disabled = true; btn.textContent = 'One moment…';
  try {
    var client = getSupabase();
    if (!client) throw new Error('Sign-in is not ready. Please refresh the page.');
    var res = await client.auth.signInWithPassword({ email: email, password: password });
    if (res.error) throw res.error;
    await finishLogin(res.data.session);
  } catch (e) {
    var msg = (e && e.message) || 'Sign-in failed. Please try again.';
    if (/invalid login|invalid credentials/i.test(msg)) msg = "Those details didn't match. Please try again.";
    if (/email not confirmed/i.test(msg)) msg = 'Please confirm your email first. Check your inbox for the link.';
    showAlert(msg);
    btn.disabled = false; btn.textContent = 'Sign in';
  }
  return false;
}
</script>
</body>
</html>
