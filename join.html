<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme-init.js"></script>
<script src="consent.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Create account — Impact Grid</title>
<meta name="description" content="Create your free Impact Grid photographer account."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#0d0d0d;--sand:#f3ede3;--line:#d9d0bf;--slate:#4a4a4a;--mute:#8a8578;--err:#b42318;--ok:#18794e;}
[data-theme="dark"]{--bg:#0c0d10;--card:#14161b;--ink:#f5f1e8;--sand:#1c1f26;--line:#2d313a;--slate:#b4b0a6;--mute:#7d7a72;--err:#ff8a7a;--ok:#5fd39b;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;}
a{color:inherit;}
.shell{min-height:100%;display:flex;flex-direction:column;}
.top{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
.top a{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;}
.top a:hover{opacity:.7;}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 24px 64px;}
.col{width:100%;max-width:342px;text-align:center;}
.logo{width:36px;height:36px;margin:0 auto 18px;border-radius:9px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.05em;}
h1{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:600;}
.sub{margin-top:12px;font-size:14px;color:var(--slate);line-height:1.5;}
.btns{margin-top:32px;display:grid;gap:11px;}
.btn{display:flex;align-items:center;width:100%;height:55px;padding:0 20px;border:1px solid var(--ink);background:var(--card);color:var(--ink);font:500 14px "DM Sans",sans-serif;cursor:pointer;transition:background .15s;}
.btn:hover{background:var(--sand);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn span{flex:1;padding-right:18px;}
.btn svg{flex-shrink:0;}
.submit{display:flex;align-items:center;justify-content:center;width:100%;height:55px;border:0;background:var(--ink);color:var(--bg);font:500 14px "DM Sans",sans-serif;cursor:pointer;}
.submit:disabled{opacity:.6;cursor:not-allowed;}
form{margin-top:32px;text-align:left;display:none;}
form.open{display:block;}
label{display:block;font-size:14px;margin-bottom:16px;}
.input{display:block;width:100%;margin-top:4px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:400 14.4px "DM Sans",sans-serif;outline:none;transition:border-color .15s,box-shadow .15s;}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(128,128,128,.18);}
.input::placeholder{color:var(--mute);}
.pw{position:relative;}
.pw .input{padding-right:58px;}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);margin-top:2px;background:none;border:0;color:var(--slate);font:600 12px "DM Sans",sans-serif;cursor:pointer;padding:6px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.link{margin-top:16px;text-align:center;font-size:14px;}
.link a{font-weight:500;text-decoration:underline;}
.err{margin-top:16px;font-size:14px;color:var(--err);text-align:center;}
.err a{color:inherit;text-decoration:underline;}
.foot{margin-top:32px;font-size:14px;color:var(--slate);}
.foot a{color:var(--ink);font-weight:500;text-decoration:underline;}
.fine{margin-top:14px;font-size:12px;color:var(--mute);line-height:1.5;text-align:center;}
.strength{display:flex;gap:4px;margin:-8px 0 6px;}
.strength i{flex:1;height:3px;background:var(--line);border-radius:2px;}
.strength i.on1{background:#d92d20;}.strength i.on2{background:#f79009;}.strength i.on3{background:#84cc16;}.strength i.on4{background:var(--ok);}
.slabel{font-size:12px;color:var(--mute);min-height:16px;margin-bottom:12px;}
.done{display:none;}
.done.show{display:block;}
.done .pill{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);padding:5px 10px;border-radius:99px;margin-bottom:16px;}
.done .submit{text-decoration:none;margin-top:28px;}
@media(max-width:480px){.row2{grid-template-columns:1fr;gap:0;}}

</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a href="index.html">&larr; Back</a>
    <a href="login.html">Sign in</a>
  </header>

  <main>
    <div class="col">
      <div id="signupView">
        <div class="logo">IG</div>
        <h1>Create your account</h1>
        <p class="sub">Free forever. No card required.</p>

        <div class="btns">
          <button type="button" class="btn" id="googleBtn" onclick="googleSignUp()">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
            <span>Sign up with Google</span>
          </button>
          <button type="button" class="btn" id="emailBtn" onclick="openEmail()" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
            <span>Sign up with Email</span>
          </button>
        </div>

        <form id="emailForm" onsubmit="return joinCreator(event)">
          <div class="row2">
            <label>First name
              <input id="fname" class="input" type="text" autocomplete="given-name" required/>
            </label>
            <label>Last name
              <input id="lname" class="input" type="text" autocomplete="family-name" required/>
            </label>
          </div>
          <label>Email
            <input id="email" class="input" type="email" autocomplete="email" required/>
          </label>
          <label>Password
            <div class="pw">
              <input id="pass" class="input" type="password" autocomplete="new-password" placeholder="At least 8 characters" oninput="checkStrength(this)" required/>
              <button type="button" class="eye" onclick="togglePass('pass',this)" aria-label="Show password">Show</button>
            </div>
          </label>
          <div class="strength"><i id="s1"></i><i id="s2"></i><i id="s3"></i><i id="s4"></i></div>
          <div class="slabel" id="slabel"></div>
          <label>Confirm password
            <div class="pw">
              <input id="pass2" class="input" type="password" autocomplete="new-password" required/>
              <button type="button" class="eye" onclick="togglePass('pass2',this)" aria-label="Show password">Show</button>
            </div>
          </label>
          <button class="submit" id="submitBtn" type="submit">Create account</button>
          <p class="fine">By creating an account you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</p>
        </form>

        <p class="err" id="alertBox" role="alert" style="display:none"></p>

        <p class="foot">Already have an account? <a href="login.html">Sign in</a></p>
      </div>

      <div class="done" id="doneView">
        <div class="logo">IG</div>
        <span class="pill">Account created</span>
        <h1 id="doneTitle"></h1>
        <p class="sub" id="doneBody"></p>
        <a href="dashboard.html" class="submit" id="doneBtn">Go to dashboard</a>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
var EVENTS_API = 'https://impactgrid-events-api.onrender.com';

function showAlert(html) {
  var el = document.getElementById('alertBox');
  el.innerHTML = html;
  el.style.display = html ? 'block' : 'none';
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function openEmail() {
  document.getElementById('emailForm').classList.add('open');
  document.getElementById('emailBtn').setAttribute('aria-expanded', 'true');
  setTimeout(function(){ document.getElementById('fname').focus(); }, 0);
}
function togglePass(id, btn) {
  var inp = document.getElementById(id);
  var hidden = inp.type === 'password';
  inp.type = hidden ? 'text' : 'password';
  btn.textContent = hidden ? 'Hide' : 'Show';
}
function checkStrength(input) {
  var v = input.value, score = 0;
  if (v.length >= 8) score++;
  if (v.length >= 12) score++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  var level = v.length === 0 ? 0 : score <= 1 ? 1 : score === 2 ? 2 : score <= 4 ? 3 : 4;
  for (var i = 1; i <= 4; i++) document.getElementById('s' + i).className = i <= level ? 'on' + level : '';
  document.getElementById('slabel').textContent = v.length ? ['', 'Weak', 'Fair', 'Good', 'Strong'][level] : '';
}

/* Ask the server to give this new account the photographer role (the browser cannot set it). */
function onboard(session) {
  if (!session) return Promise.resolve();
  var call = fetch(EVENTS_API + '/api/photographer-onboard', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + session.access_token }
  }).catch(function(){});
  var wait = new Promise(function(res){ setTimeout(res, 8000); });
  return Promise.race([call, wait]);
}

async function googleSignUp() {
  var c = getSupabase();
  if (!c) { showAlert('Sign-up is not ready. Please refresh the page.'); return; }
  showAlert('');
  try {
    /* login.html finishes the job after Google returns: it gives a new account the photographer role. */
    var res = await c.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/login.html',
        queryParams: { prompt: 'select_account' }
      }
    });
    if (res.error) throw res.error;
  } catch (err) {
    showAlert("Google sign-up isn't available right now. Please use email instead.");
  }
}

async function joinCreator(ev) {
  if (ev) ev.preventDefault();
  showAlert('');
  var fname = document.getElementById('fname').value.trim();
  var lname = document.getElementById('lname').value.trim();
  var email = document.getElementById('email').value.trim();
  var pass  = document.getElementById('pass').value;
  var pass2 = document.getElementById('pass2').value;
  var btn   = document.getElementById('submitBtn');

  if (!fname || !lname) { showAlert('Please enter your first and last name.'); return false; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('Please enter a valid email address.'); return false; }
  if (pass.length < 8) { showAlert('Password must be at least 8 characters.'); return false; }
  if (pass !== pass2) { showAlert('Passwords do not match.'); return false; }

  btn.disabled = true; btn.textContent = 'One moment…';
  try {
    var c = getSupabase();
    if (!c) throw new Error('Sign-up is not ready. Please refresh the page.');
    var fullName = fname + ' ' + lname;
    /* signup_intent only marks that this person signed up as a photographer; the SERVER grants the role. */
    var res = await c.auth.signUp({
      email: email,
      password: pass,
      options: { data: { full_name: fullName, signup_intent: 'photographer' } }
    });
    if (res.error) throw res.error;

    /* Supabase returns no error for an email that already exists when confirmation is on: identities is empty. */
    if (res.data.user && Array.isArray(res.data.user.identities) && res.data.user.identities.length === 0) {
      throw new Error('already registered');
    }

    var hasSession = !!res.data.session;
    if (hasSession) await onboard(res.data.session);

    document.getElementById('signupView').style.display = 'none';
    document.getElementById('doneTitle').textContent = 'Welcome, ' + fname;
    document.getElementById('doneBody').textContent = hasSession
      ? 'Your account is ready. Head to your dashboard to get started.'
      : 'Almost there. Check your email and click the confirmation link, then sign in.';
    if (!hasSession) {
      var b = document.getElementById('doneBtn');
      b.textContent = 'Go to sign in'; b.setAttribute('href', 'login.html');
    }
    document.getElementById('doneView').classList.add('show');
  } catch (err) {
    var msg = (err && err.message) || 'Something went wrong. Please try again.';
    if (/already registered|already been registered/i.test(msg)) {
      showAlert('This email is already registered. <a href="login.html">Sign in instead</a>');
    } else {
      showAlert(esc(msg));
    }
    btn.disabled = false; btn.textContent = 'Create account';
  }
  return false;
}

/* Already signed in: straight to the dashboard */
(function(){
  var c = getSupabase();
  if (!c) return;
  c.auth.getSession().then(function(r){
    if (r.data && r.data.session && !document.getElementById('doneView').classList.contains('show')) {
      window.location.href = 'dashboard.html';
    }
  }).catch(function(){});
})();
</script>
</body>
</html>
