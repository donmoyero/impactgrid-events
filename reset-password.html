<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reset Password — Impact Grid</title>
<meta name="description" content="Reset your Impact Grid account password."/>
<meta name="robots" content="noindex, nofollow"/>

<!-- Shared design system -->
<link rel="stylesheet" href="shared.css"/>

<style>
/* ── Reset-password-page-only styles (mirrors login.html card layout) ── */
.login-bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 55% 55% at 20% 30%,rgba(201,126,8,.07),transparent),
    radial-gradient(ellipse 40% 40% at 80% 70%,rgba(45,110,219,.04),transparent);}
[data-theme="dark"] .login-bg{
  background:
    radial-gradient(ellipse 55% 55% at 20% 30%,rgba(240,180,41,.07),transparent),
    radial-gradient(ellipse 40% 40% at 80% 70%,rgba(79,142,247,.04),transparent);}

.page{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--nav-h) + 40px) 20px 40px;position:relative;z-index:1;}

.auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:44px 40px;width:100%;max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.07);
  animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both;}
[data-theme="dark"] .auth-card{box-shadow:0 20px 60px rgba(0,0,0,.5);}

.card-logo{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:24px;}
.card-logo-mark{width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fm);font-size:11px;font-weight:700;color:#fff;letter-spacing:.05em;}
[data-theme="dark"] .card-logo-mark{color:#07090f;}
.card-logo-name{font-family:var(--fd);font-weight:900;font-size:16px;letter-spacing:-.03em;}
.auth-card h1{font-family:var(--fd);font-size:24px;font-weight:900;
  letter-spacing:-.03em;text-align:center;margin-bottom:6px;}
.card-sub{font-size:14px;color:var(--text2);text-align:center;margin-bottom:28px;line-height:1.6;}

.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;}

.btn-submit{width:100%;padding:13px;border-radius:10px;border:none;cursor:pointer;
  font-family:var(--fb);font-size:14px;font-weight:700;margin-top:6px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;
  transition:transform .2s,box-shadow .2s;}
[data-theme="dark"] .btn-submit{color:#07090f;}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 28px var(--gold-glo);}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}

.dots{display:inline-flex;gap:4px;align-items:center;margin-left:6px;vertical-align:middle;}
.dot{width:4px;height:4px;border-radius:50%;background:currentColor;
  opacity:.4;animation:dp 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes dp{0%,80%,100%{opacity:.3;}40%{opacity:1;}}

.card-footer{text-align:center;font-size:13px;color:var(--text2);margin-top:18px;}
.card-footer a{color:var(--gold);font-weight:700;}
.card-footer a:hover{text-decoration:underline;}

.success-icon{width:52px;height:52px;border-radius:50%;background:var(--gold);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:24px;margin:0 auto 18px;}

@media(max-width:480px){
  .auth-card{padding:32px 22px;border-radius:16px;}
}
</style>
</head>
<body>

<!-- ── Script load order required by nav.js ── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="plan-config.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>

<!-- ── Nav (rendered by nav.js) ── -->
<div id="ig-nav"></div>
<script src="nav.js"></script>
<script>renderNav('reset-password.html');</script>

<div class="login-bg"></div>

<div class="page">
  <div class="auth-card" id="requestCard">

    <div class="card-logo">
      <div class="card-logo-mark">IG</div>
      <span class="card-logo-name">Impact Grid</span>
    </div>

    <h1>Reset your password</h1>
    <p class="card-sub">Enter your account email and we'll send you a link to reset your password.</p>

    <div class="alert" id="alertBox"></div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input id="email" class="form-input" type="email"
        placeholder="you@example.com" autocomplete="email"
        onkeydown="if(event.key==='Enter')sendResetLink()"/>
    </div>

    <button class="btn-submit" id="resetBtn" onclick="sendResetLink()">Send Reset Link →</button>

    <div class="card-footer">
      <a href="login.html">← Back to login</a>
    </div>

  </div>

  <!-- Shown after the reset email is sent -->
  <div class="auth-card" id="sentCard" style="display:none;">
    <div class="success-icon">✓</div>
    <h1>Check your email</h1>
    <p class="card-sub">If an account exists for that address, a password reset link is on its way.</p>
    <div class="card-footer">
      <a href="login.html">← Back to login</a>
    </div>
  </div>
</div>

<!-- Footer (rendered by nav.js) -->
<div id="ig-footer"></div>
<script>renderFooter();</script>

<script>
function showAlert(msg, type) {
  var el = document.getElementById('alertBox');
  el.innerHTML = msg;
  el.className = 'alert alert-' + type + ' show';
}

async function sendResetLink() {
  var email = document.getElementById('email').value.trim();
  if (!email) { showAlert('Please enter your email address.', 'error'); return; }

  var client = getSupabase();
  if (!client) { showAlert('Auth service not ready — please refresh.', 'error'); return; }

  var btn = document.getElementById('resetBtn');
  btn.disabled = true;
  btn.innerHTML = 'Sending<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';

  try {
    await client.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://impactgridgroup.com/login.html'
    });
  } catch (e) {
    /* Intentionally fall through to the same "check your email" state
       regardless of outcome — avoids confirming/denying which emails
       have accounts. */
    console.error('[reset-password]', e && e.message);
  }

  document.getElementById('requestCard').style.display = 'none';
  document.getElementById('sentCard').style.display = 'block';
}
</script>

</body>
</html>
