  <style>
    :root { --pf: 'Fraunces', Georgia, serif; }

    .pf-page { padding: 80px 24px 100px; }
    .pf-label {
      font-family: var(--fm); font-size: 10px; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--text); text-align: center; margin-bottom: 16px;
    }
    .pf-title {
      font-family: var(--fb); font-size: clamp(36px, 4.5vw, 64px);
      font-weight: 900; line-height: 1.04; letter-spacing: -0.03em;
      color: var(--text); text-align: center; margin-bottom: 14px;
    }
    .pf-intro {
      max-width: 620px; margin: 0 auto 44px; text-align: center;
      font-family: var(--pf); font-size: 16px; line-height: 1.6;
      color: var(--text2, #4a4234);
    }

    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    .skeleton-book {
      aspect-ratio: 2 / 3; border-radius: 4px 8px 8px 4px;
      background: linear-gradient(90deg, #e8e4dc 25%, #f0ede6 50%, #e8e4dc 75%);
      background-size: 800px 100%; animation: shimmer 1.4s infinite;
    }
    .shelf {
      max-width: var(--max-w); margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 36px 28px; align-items: end;
    }
    .closed-book {
      position: relative; aspect-ratio: 2 / 3; border-radius: 4px 8px 8px 4px;
      cursor: pointer; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    .closed-book:hover { transform: translateY(-6px) rotate(-1deg); }
    .closed-book.disabled { cursor: default; }
    .closed-book.disabled:hover { transform: none; }
    .closed-book-cover {
      position: absolute; inset: 0; border-radius: 4px 8px 8px 4px;
      background: linear-gradient(135deg, #1d1812 0%, #100d09 100%);
      box-shadow: -4px 0 0 rgba(0,0,0,0.35) inset, 6px 10px 28px rgba(0,0,0,0.35);
      overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    }
    .closed-book-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.78; }
    .closed-book-cover::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.15) 55%, transparent 80%);
    }
    .closed-book-spine {
      position: absolute; top: 0; left: 0; bottom: 0; width: 10px;
      background: linear-gradient(to right, rgba(0,0,0,0.5), rgba(255,255,255,0.05)); z-index: 2;
    }
    .closed-book-info { position: relative; z-index: 1; padding: 16px 16px 18px; }
    .closed-book-tag {
      font-family: var(--fm); font-size: 8.5px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 6px;
    }
    .closed-book-title { font-family: var(--pf); font-size: 16px; font-weight: 400; line-height: 1.25; color: #fff; }
    .closed-book-meta { font-family: var(--fm); font-size: 9px; color: rgba(255,255,255,0.45); margin-top: 6px; }
    .closed-book.placeholder .closed-book-cover { background: linear-gradient(135deg, var(--gold) 0%, var(--gold2) 100%); }
    .closed-book.placeholder .closed-book-cover::after { background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 70%); }
    .closed-book.placeholder .closed-book-title { font-size: 19px; }

    /* ═══════════════════════════════════════
       POST VIEW — one category, full page
    ═══════════════════════════════════════ */
    .post-view {
      position: fixed; inset: 0; z-index: 2000; background: #fff; overflow-y: auto;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .post-view.show { opacity: 1; pointer-events: auto; }

    .post-topbar {
      position: sticky; top: 0; left: 0; right: 0; z-index: 2010;
      display: flex; align-items: center; justify-content: space-between; padding: 14px 20px;
      background: rgba(var(--surface),0.92); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(var(--ink),0.08);
    }
    .post-back {
      font-family: var(--fm); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(var(--ink),0.65); display: flex; align-items: center; gap: 6px;
      cursor: pointer; border: none; background: none; padding: 6px 10px; border-radius: 6px; transition: color 0.2s;
    }
    .post-back:hover { color: var(--text); background: rgba(var(--ink),0.06); }
    .post-close {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(var(--ink),0.06); border: 1px solid rgba(var(--ink),0.14);
      color: var(--text); font-size: 16px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s;
    }
    .post-close:hover { background: rgba(var(--ink),0.12); }

    .post-hero-wrap { position: relative; width: 100%; height: 460px; margin-top: 64px; overflow: hidden; background: #1a1612; }
    .post-hero { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; opacity: 0.85; }
    .post-hero-wrap::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,8,5,0.88) 0%, rgba(10,8,5,0.45) 45%, rgba(10,8,5,0.08) 75%, transparent 100%);
      pointer-events: none;
    }
    .post-header { position: absolute; bottom: 0; left: 0; right: 0; z-index: 2; padding: 0 40px 32px; }
    .post-tag {
      font-family: var(--fm); font-size: 9px; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 10px;
    }
    .post-title {
      font-family: var(--fb); font-size: clamp(24px, 3.5vw, 42px); font-weight: 900;

    .post-hero-wrap.no-image::after { display: none; }
    .post-hero-wrap.no-image .post-header { position: relative; padding: 36px 40px 40px; }

    @media (max-width: 700px) {
      .post-hero-wrap { height: 340px; }
      .post-header { padding: 0 20px 26px; }
      .post-hero-wrap.no-image .post-header { padding: 28px 20px 32px; }

    .post-intro {
      max-width: 720px; margin: 0 auto; padding: 40px 24px 8px;

    }

    .pf-gallery {
      max-width: 1040px; margin: 24px auto 0; padding: 0 24px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;
    }
    .pf-gallery figure { margin: 0; }
    .pf-gallery img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 10px; display: block; cursor: zoom-in; }
    .pf-gallery figcaption { margin-top: 6px; font-family: var(--fm); font-size: 11px; color: rgba(var(--ink),0.5); text-align: center; }

    .post-empty { text-align: center; font-family: var(--fm); font-size: 12px; color: rgba(var(--ink),0.4); padding: 60px 0; }

    /* ── Related categories ── */
    .related-section {
      max-width: 1040px; margin: 60px auto 0; padding: 0 24px;
      border-top: 1px solid rgba(var(--ink),0.1); padding-top: 44px;
    }
    .related-heading {
      font-family: var(--fm); font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(var(--ink),0.45); margin-bottom: 20px;
    }
    .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
    .related-card { cursor: pointer; border-radius: 8px; overflow: hidden; background: var(--bg2, #f7f4ef); transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1); }
    .related-card:hover { transform: translateY(-4px); }
    .related-card-img { width: 100%; aspect-ratio: 3/2; object-fit: cover; display: block; background: var(--bg3, #e8e4dc); }
    .related-card-info { padding: 12px 14px 14px; }
    .related-card-title { font-family: var(--pf); font-size: 14px; line-height: 1.3; color: var(--text); }

    .post-cta { max-width: 720px; margin: 48px auto 80px; padding: 0 24px; }
    .post-cta-inner {
      background: linear-gradient(135deg, #1d1812 0%, #2e2518 100%); border-radius: 14px;
      padding: 44px 36px; text-align: center; position: relative; overflow: hidden;
    }
    .post-cta-inner::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(184,150,74,0.18) 0%, transparent 60%); }
    .post-cta-label { font-family: var(--fm); font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold, #b8964a); margin-bottom: 12px; position: relative; }
    .post-cta-heading { font-family: var(--fb); font-size: clamp(20px, 3vw, 28px); font-weight: 900; line-height: 1.1; letter-spacing: -0.02em; color: #fff; margin-bottom: 22px; position: relative; }
    .post-cta-btn {
      display: inline-block; font-family: var(--fm); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 13px 28px; border-radius: 28px; background: var(--gold, #b8964a); color: #fff;
      text-decoration: none; border: none; cursor: pointer; transition: opacity 0.2s; position: relative;
    }
    .post-cta-btn:hover { opacity: 0.88; }

    .lightbox {
      position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.22s;
    }
    .lightbox.show { opacity: 1; pointer-events: auto; }
    .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 6px; box-shadow: 0 20px 80px rgba(0,0,0,0.6); }
    .lightbox-close {
      position: fixed; top: 20px; right: 24px; width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 18px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.22); }

    @media (max-width: 700px) {
      .pf-page { padding: 56px 14px 80px; }
      .shelf { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 16px; }
      .post-intro { padding: 30px 18px 8px; }
      .pf-gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); padding: 0 14px; }
      .post-cta-inner { padding: 32px 22px; }
      .related-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .post-topbar { padding: 10px 14px; }
    }
  </style>

  <script>
  /* ════════════════════════════════════════
     PORTFOLIO ENGINE
     portfolio_categories { id, title, slug, meta_description, cover_image, created_at }
     portfolio_images     { id, category_id, order, url, cloudinary_id, alt_text, caption }
  ════════════════════════════════════════ */

  var categories = [];
  var activeCategory = null;
  var activeCategoryIdx = -1;

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  /* ── Slug for URL ── */
  function slugifyLocal(title) {
    return String(title || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  /* ── Render shelf ── */
  function renderShelf() {
    var shelf = document.getElementById('shelf');
    if (!categories.length) {
      shelf.innerHTML =
        '<div class="closed-book disabled placeholder">' +
          '<div class="closed-book-cover">' +
            '<div class="closed-book-info">' +
              '<div class="closed-book-tag">Coming soon</div>' +
              '<div class="closed-book-title">Impact Grid Portfolio</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      return;
    }
    shelf.innerHTML = categories.map(function(c, i) {
      return '<div class="closed-book" data-idx="' + i + '" onclick="openCategory(' + i + ')">' +
        '<div class="closed-book-cover">' +
          (c.coverImage ? '<img src="' + esc(c.coverImage) + '" alt="' + esc(c.title) + '">' : '') +
          '<div class="closed-book-spine"></div>' +
          '<div class="closed-book-info">' +
            '<div class="closed-book-tag">Portfolio</div>' +
            '<div class="closed-book-title">' + esc(c.title) + '</div>' +
            '<div class="closed-book-meta">' + c.images.length + (c.images.length === 1 ? ' photo' : ' photos') + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* ── SEO: rewrite title/canonical/meta/og tags for the open category ── */
  var _defaultMeta = null;
  function captureDefaultMeta() {
    if (_defaultMeta) return;
    _defaultMeta = {
      title: document.getElementById('pfPageTitle').textContent,
      canonical: document.getElementById('pfCanonical').href,
      desc: document.getElementById('pfMetaDesc').content,
      ogTitle: document.getElementById('pfOgTitle').content,
      ogDesc: document.getElementById('pfOgDesc').content,
      ogUrl: document.getElementById('pfOgUrl').content,
      ogImage: document.getElementById('pfOgImage').content,
      twTitle: document.getElementById('pfTwTitle').content,
      twDesc: document.getElementById('pfTwDesc').content
    };
  }
  function setCategoryMeta(cat) {
    captureDefaultMeta();
    var title = cat.title + ' — Impact Grid Portfolio';
    var desc = cat.metaDescription || ('Professional ' + cat.title.toLowerCase() + ' by Impact Grid.');
    var url = 'https://impactgridgroup.com/portfolio.html?category=' + encodeURIComponent(cat.slug);
    document.title = title;
    document.getElementById('pfPageTitle').textContent = title;
    document.getElementById('pfCanonical').href = url;
    document.getElementById('pfMetaDesc').content = desc;
    document.getElementById('pfOgTitle').content = title;
    document.getElementById('pfOgDesc').content = desc;
    document.getElementById('pfOgUrl').content = url;
    document.getElementById('pfTwTitle').content = title;
    document.getElementById('pfTwDesc').content = desc;
    if (cat.coverImage) document.getElementById('pfOgImage').content = cat.coverImage;
  }
  function restoreDefaultMeta() {
    if (!_defaultMeta) return;
    document.title = _defaultMeta.title;
    document.getElementById('pfPageTitle').textContent = _defaultMeta.title;
    document.getElementById('pfCanonical').href = _defaultMeta.canonical;
    document.getElementById('pfMetaDesc').content = _defaultMeta.desc;
    document.getElementById('pfOgTitle').content = _defaultMeta.ogTitle;
    document.getElementById('pfOgDesc').content = _defaultMeta.ogDesc;
    document.getElementById('pfOgUrl').content = _defaultMeta.ogUrl;
    document.getElementById('pfOgImage').content = _defaultMeta.ogImage;
    document.getElementById('pfTwTitle').content = _defaultMeta.twTitle;
    document.getElementById('pfTwDesc').content = _defaultMeta.twDesc;
  }

  /* ── JSON-LD ── */
  function injectJsonLd(cat) {
    removeJsonLd();
    if (!cat) return;
    var script = document.createElement('script');
    script.type = 'application/ld+json';
    script.id = 'pf-jsonld';
    var data = {
      '@context': 'https://schema.org',
      '@type': 'ImageGallery',
      'name': cat.title,
      'description': cat.metaDescription || '',
      'url': 'https://impactgridgroup.com/portfolio.html?category=' + encodeURIComponent(cat.slug),
      'author': { '@type': 'Organization', 'name': 'Impact Grid', 'url': 'https://impactgridgroup.com' },
      'image': cat.images.map(function(img){ return img.url; })
    };
    script.textContent = JSON.stringify(data);
    document.head.appendChild(script);
  }
  function removeJsonLd() {
    var el = document.getElementById('pf-jsonld');
    if (el) el.remove();
  }

  /* ── URL routing ── */
  function pushCategoryState(cat) {
    history.pushState({ categorySlug: cat.slug }, '', '?category=' + encodeURIComponent(cat.slug));
  }
  function clearCategoryState() {
    history.pushState({}, '', 'portfolio.html');
  }
  function checkUrlCategory() {
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('category');
    if (!slug || !categories.length) return;
    for (var i = 0; i < categories.length; i++) {
      if (categories[i].slug === slug) { openCategory(i); return; }
    }
  }
  window.addEventListener('popstate', function(e) {
    if (!(e.state && e.state.categorySlug) && activeCategory) closeCategory(false);
  });

  /* ── Gallery + related ── */
  function renderGallery() {
    var el = document.getElementById('pfGallery');
    var images = activeCategory.images;
    if (!images.length) {
      el.innerHTML = '<div class="post-empty">No photos yet.</div>';
      return;
    }
    el.innerHTML = images.map(function(img) {
      return '<figure>' +
        '<img src="' + esc(img.url) + '" alt="' + esc(img.altText || activeCategory.title) + '" onclick="openLightbox(this.src)">' +
        (img.caption ? '<figcaption>' + esc(img.caption) + '</figcaption>' : '') +
        '</figure>';
    }).join('');
  }
  function renderRelated() {
    var section = document.getElementById('relatedSection');
    var grid = document.getElementById('relatedGrid');
    var related = categories.filter(function(c, i) { return i !== activeCategoryIdx; }).slice(0, 4);
    if (!related.length) { section.style.display = 'none'; return; }
    section.style.display = '';
    grid.innerHTML = related.map(function(c) {
      var idx = categories.indexOf(c);
      return '<div class="related-card" onclick="openCategory(' + idx + ')">' +
        (c.coverImage ? '<img class="related-card-img" src="' + esc(c.coverImage) + '" alt="' + esc(c.title) + '">' :
          '<div class="related-card-img"></div>') +
        '<div class="related-card-info"><div class="related-card-title">' + esc(c.title) + '</div></div>' +
      '</div>';
    }).join('');
  }

  /* ── Open / close ── */
  function openCategory(i) {
    activeCategory = categories[i];
    activeCategoryIdx = i;
    if (!activeCategory) return;

    document.getElementById('postTitle').textContent = activeCategory.title;
    document.getElementById('postIntro').textContent = activeCategory.metaDescription || '';

    var hero = document.getElementById('postHero');
    var heroWrap = document.getElementById('postHeroWrap');
    if (activeCategory.coverImage) {
      hero.src = activeCategory.coverImage;
      hero.alt = activeCategory.title;
      hero.style.display = 'block';
      heroWrap.classList.remove('no-image');
    } else {
      hero.style.display = 'none';
      heroWrap.classList.add('no-image');
    }

    renderGallery();
    renderRelated();

    document.getElementById('postView').classList.add('show');
    document.getElementById('postView').scrollTop = 0;
    document.body.style.overflow = 'hidden';

    pushCategoryState(activeCategory);
    setCategoryMeta(activeCategory);
    injectJsonLd(activeCategory);
  }

  function closeCategory(updateHistory) {
    document.getElementById('postView').classList.remove('show');
    document.body.style.overflow = '';
    removeJsonLd();
    restoreDefaultMeta();
    activeCategory = null;
    activeCategoryIdx = -1;
    if (updateHistory !== false) clearCategoryState();
  }

  document.getElementById('postCloseBtn').addEventListener('click', function(){ closeCategory(true); });
  document.getElementById('postBackBtn').addEventListener('click', function(){ closeCategory(true); });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      if (document.getElementById('lightbox').classList.contains('show')) closeLightbox();
      else if (activeCategory) closeCategory(true);
    }
  });

  /* ── Lightbox ── */
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('show');
  }
  function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', function(e){ if (e.target === this) closeLightbox(); });

  /* ── Load from Supabase ── */
  async function loadCategories() {
    try {
      var sb = getContentClient();
      var { data: cats, error: catErr } = await sb
        .from('portfolio_categories')
        .select('*')
        .order('created_at', { ascending: false });
      if (catErr) throw catErr;

      var loaded = [];
      for (var i = 0; i < (cats || []).length; i++) {
        var c = cats[i];
        var { data: imgs, error: imgErr } = await sb
          .from('portfolio_images')
          .select('*')
          .eq('category_id', c.id)
          .order('order', { ascending: true });
        if (imgErr) throw imgErr;
        loaded.push({
          id: c.id,
          title: c.title || 'Untitled',
          slug: c.slug || slugifyLocal(c.title),
          metaDescription: c.meta_description || '',
          coverImage: c.cover_image || '',
          createdAt: c.created_at || '',
          images: (imgs || []).map(function(img) {
            return { id: img.id, url: img.url, altText: img.alt_text || '', caption: img.caption || '' };
          })
        });
      }
      categories = loaded;
    } catch (e) {
      console.warn('Portfolio fetch failed:', e);
      categories = [];
    }
    renderShelf();
    checkUrlCategory();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadCategories);
  } else {
    loadCategories();
  }
  </script>

</body>
</html>
